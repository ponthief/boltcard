# fail2ban filter for the bolt card service behind Caddy
#
# It reads Caddy's access log, in either the JSON format or a common log
# format, and matches two kinds of caller:
#
#   - one the card service turned away for going too fast (HTTP 429) or because
#     it was already handling all it would take at once (HTTP 503), or that
#     asked for a path the site does not serve (HTTP 404)
#   - one asking for a path only a scanner asks for, whatever the answer was.
#     A site that answers unknown paths with its own page, as a single page app
#     does, returns 200 to a scanner, so status alone does not find these.
#
# The card service answers its own errors with HTTP 200 and a status of ERROR
# in the body, as LNURL requires, so a bad one time code or a wrong CMAC cannot
# be told apart by status. Those are already bounded by the rate limits in the
# service itself, which is what produces the 429s matched here.
#
# Caddy must be told which proxies to trust, so that the address matched is the
# caller rather than the reverse proxy. See docs/FAIL2BAN.md - getting this
# wrong bans your own reverse proxy, and with it everybody.

[Definition]

# paths that only a scanner asks for
#
# The first line is unambiguous. The second holds paths that many sites do
# serve - remove any that yours serves, or a real visitor gets banned.
scanpaths = /wp-login|/wp-admin|/xmlrpc\.php|/administrator|/phpmyadmin|/\.env|/\.git|/cgi-bin|/vendor/|/shell|/solr|/hudson|/jenkins
sitepaths = /admin|/console|/panel|/backoffice|/portal|/dashboard|/reset-password
badpaths = <scanpaths>|<sitepaths>

failregex = ^.*"client_ip":"<HOST>".*"status":(?:429|503|404),.*$
            ^.*"remote_ip":"<HOST>"(?!.*"client_ip").*"status":(?:429|503|404),.*$
            ^.*"client_ip":"<HOST>".*"uri":"(?:<badpaths>)[^"]*".*$
            ^.*"remote_ip":"<HOST>"(?!.*"client_ip").*"uri":"(?:<badpaths>)[^"]*".*$
            ^<HOST> .*"[A-Z]+ [^"]*" (?:429|503|404) \d+\s*$
            ^<HOST> .*"[A-Z]+ (?:<badpaths>)[^"]*".*$

ignoreregex =

# Caddy writes unix seconds in its JSON log by default, or RFC 3339 where the
# log directive sets time_format. A common log format carries its own.
datepattern = "ts":{EPOCH}
              "ts":"%%Y-%%m-%%dT%%H:%%M:%%S
              \[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]

journalmatch = _SYSTEMD_UNIT=caddy.service
