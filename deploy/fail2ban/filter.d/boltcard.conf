# fail2ban filter for the bolt card service behind Caddy
#
# It reads Caddy's JSON access log and matches two things:
#
#   - a request the card service turned away for going too fast (HTTP 429) or
#     because it was already handling all it would take at once (HTTP 503)
#   - a request for a path the site does not serve (HTTP 404), which is what
#     scanning looks like
#
# The card service answers its own errors with HTTP 200 and a status of ERROR
# in the body, as LNURL requires, so a bad one time code or a wrong CMAC cannot
# be told apart by status alone. Those are already bounded by the rate limits
# in the service itself, which is what produces the 429s matched here.
#
# Caddy must be logging JSON, and must be told which proxies to trust so that
# client_ip holds the caller rather than the reverse proxy. See
# docs/FAIL2BAN.md.

[Definition]

# client_ip is present when Caddy has trusted_proxies configured, and is the
# address of the caller rather than of Cloudflare
failregex = ^.*"client_ip":"<HOST>".*"status":(?:429|503|404),.*$
            ^.*"remote_ip":"<HOST>"(?!.*"client_ip").*"status":(?:429|503|404),.*$

ignoreregex =

# Caddy writes unix seconds by default, or RFC 3339 where the log directive
# sets time_format
datepattern = "ts":{EPOCH}
              "ts":"%%Y-%%m-%%dT%%H:%%M:%%S

journalmatch = _SYSTEMD_UNIT=caddy.service
